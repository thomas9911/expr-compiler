[package]
name = "expr-compiler"
version = "0.1.0"
edition = "2024"
autoexamples = false

[features]
default = []
llvm-backend = ["dep:inkwell"]
wasi = [
    "llvm-backend",
    "dep:wit-component",
    "dep:wasi-preview1-component-adapter-provider",
]

[dependencies]
cranelift = { version = "*", features = ["module", "jit", "native", "object", "interpreter"] }
cranelift-reader = "0.127.1"
inkwell = { version = "0.9.0", features = ["llvm20-1"], optional = true }
logos = "0.16.0"
pico-args = "0.5.0"
wit-component = { version = "0.227.0", optional = true }
wasi-preview1-component-adapter-provider = { version = "44.0.0", optional = true }
